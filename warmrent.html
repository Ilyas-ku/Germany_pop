<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warm Rent Map</title>
  </head>

  <body data-metric="rent">
    <div class="wm">
      <aside class="wm-side">
        <h1>Warm rent for a 60 m² flat</h1>
        <p class="wm-sub">
          Monthly warm rent of a 60&nbsp;m² flat on a new lease, by district: asking rent 2025 plus utilities and heating. Darker = more expensive.
        </p>

        <div class="wm-controls" role="radiogroup" aria-label="Wage">
          <label><input type="radio" name="wage" value="wo" checked /> Wage where people live</label>
          <label><input type="radio" name="wage" value="ao" /> Wage where people work</label>
        </div>

        <div id="legend" class="wm-legend"></div>

        <div id="info" class="wm-info">Hover or tap a district.</div>

        <div class="wm-ranks">
          <section>
            <h2>Most expensive</h2>
            <table id="top"></table>
          </section>
          <section>
            <h2>Cheapest</h2>
            <table id="bottom"></table>
          </section>
        </div>

        <details class="wm-method">
          <summary>Method and sources</summary>
          <ul id="method"></ul>
        </details>
      </aside>

      <div id="map" class="wm-map"></div>
    </div>

    <script type="module" src="/src/warm.js"></script>
  </body>
</html>
